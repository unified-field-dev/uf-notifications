[package]
name = "notifications-mount-host"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true
description = "Teaching host: /notifications protect + inventory contract + NotificationBell shell slot"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
http-body-util = "0.1"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
